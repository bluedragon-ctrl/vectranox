<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VectraNox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="popups"></div>
    <div id="boss-bar" class="hidden"></div>

    <div id="app">
      <aside id="panel">
        <header class="logo">VECTRA<span>NOX</span></header>

        <section id="hud">
          <div class="score-main"><span>SCORE</span><b id="hud-score">000000</b></div>
          <div class="hud-big"><span>TIME</span><b id="hud-time">0:00</b></div>
          <div class="hud-big"><span>CHAIN</span><b id="hud-chain">—</b></div>
          <div class="hud-big"><span>MULT</span><b id="hud-mult">×1</b></div>
          <div class="hud-row">
            <span>CREDITS</span><b id="hud-credits">0</b>
            <span>ROOM</span><b id="hud-room">1/12</b>
            <span>LIVES</span><b id="hud-lives">3</b>
          </div>
        </section>

        <section class="block" id="powers">
          <h2>// POWER</h2>
          <div id="power-list"></div>
        </section>

        <section class="block" id="mods">
          <h2>// MODS</h2>
          <div id="mod-list"></div>
        </section>

        <section class="block" id="sys">
          <h2>// SYS</h2>
          <dl>
            <dt>FPS</dt><dd id="sys-fps">--</dd>
            <dt>BALLS</dt><dd id="sys-balls">0</dd>
          </dl>
        </section>

        <section class="block grow hidden" id="console-block">
          <h2>// EVENT LOG</h2>
          <div id="console"></div>
        </section>
      </aside>

      <main id="field-area">
        <div id="event-banner" class="hidden">
          <h2 id="event-title"></h2>
          <p id="event-sub"></p>
        </div>
        <div id="run-screen" class="hidden"></div>
        <div id="overlay" class="hidden">
          <h1 id="overlay-title"></h1>
          <p id="overlay-sub"></p>
          <form id="name-entry" class="hidden">
            <label for="name-field">NAME</label>
            <input id="name-field" type="text" autocomplete="off" spellcheck="false" />
            <button type="submit">SAVE</button>
          </form>
          <div id="menu">
            <section class="block" id="scores">
              <h2>// HIGH SCORES</h2>
              <ol id="score-list"></ol>
            </section>
            <div class="options">
              <section class="block" id="video">
                <h2>// VIDEO</h2>
                <div id="video-toggles"></div>
              </section>
              <section class="block" id="audio">
                <h2>// AUDIO</h2>
                <div id="audio-controls"></div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
